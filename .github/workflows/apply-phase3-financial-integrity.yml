name: Apply Phase 3 financial integrity

on:
  push:
    branches: [agent/phase-3-financial-integrity]
    paths:
      - '.github/workflows/apply-phase3-financial-integrity.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roastgrid_phase3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d roastgrid_phase3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/roastgrid_phase3
      BETTER_AUTH_SECRET: phase3-secret-value-that-is-longer-than-thirty-two-characters
      BETTER_AUTH_URL: http://localhost:3000
      DEMO_MODE: "false"

    steps:
      - name: Checkout Phase 3 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-3-financial-integrity
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply financial integrity patch
        run: python3 scripts/apply_phase3_financial_integrity.py

      - name: Verify patch formatting
        run: git diff --check

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Apply clean-database migrations
        run: npm run db:migrate

      - name: Database integration tests
        run: npm run test:db

      - name: Production build
        run: npm run build

      - name: Publish validated patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply_phase3_financial_integrity.py
          rm -f .github/workflows/apply-phase3-financial-integrity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes to publish."
            exit 0
          fi
          git commit -m "fix: enforce inventory valuation integrity"
          git push origin HEAD:agent/phase-3-financial-integrity
